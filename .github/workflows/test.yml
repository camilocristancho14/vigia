name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: swift test
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          picked=""
          for v in 26.2 26.1 26.0 16.4 16.3 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_${v}.app" ]; then
              picked="/Applications/Xcode_${v}.app"
              break
            fi
          done
          if [ -z "$picked" ]; then
            echo "No Xcode 16 or newer on this runner" >&2
            exit 1
          fi
          sudo xcode-select -s "$picked"
          swift --version

      - name: Build and test
        run: swift test

      - name: Build packaged app
        run: bash scripts/make-app.sh

      - name: Capture demo previews
        continue-on-error: true
        run: bash scripts/capture-screenshots.sh

      - name: Upload Mac app and installers
        uses: actions/upload-artifact@v4
        with:
          name: Vigia-macos-${{ github.sha }}
          path: |
            build.noindex/Vigia.app
            build.noindex/Vigia.zip
            build.noindex/Vigia.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload demo previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vigia-demo-previews-${{ github.sha }}
          path: build.noindex/screenshots/expanded-light.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Hook command rules (macOS's own bash 3.2)
        run: /bin/bash scripts/test-vigia-notify.sh
